name: Node compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Exact pins cover the audited floor, boundary minors and released
        # majors; 22.x exercises the latest released 22 patch.
        node: [22.0.0, 22.x, 23.11.1, 24.22.2, 25.9.0, 26.13.0]
        include:
          # Exercise both sides of the runtime API and former engine boundaries.
          - os: macos-latest
            node: 22.7.0
          - os: macos-latest
            node: 22.8.0
          - os: macos-latest
            node: 22.11.0
          - os: macos-latest
            node: 22.12.0
    env:
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Keep npm at the audited version used for the compatibility evidence.
      - name: Use the audited npm version
        if: runner.os != 'Windows'
        run: npm install --global npm@10.9.8 --no-audit --no-fund
      # Node 22.0.0 can pick up a broken preinstalled global npm shim on
      # hosted Windows runners. Bootstrap with npm bundled beside node.exe.
      - name: Use the audited npm version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          & node (Join-Path $nodeDir 'node_modules/npm/bin/npm-cli.js') install --global npm@10.9.8 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The committed lockfile accepts Node >=22.0.0 for packages whose
      # published engines do not. --engine-strict guards that record.
      - name: Install from the committed lockfile
        run: npm ci --engine-strict --no-audit --no-fund
      - name: Verify the resolved dependency graph
        run: npm ls @shopify/mini-oxygen body-parser undici vite esbuild framer-motion motion-dom motion-utils --all
      - name: Verify the published CLI shim and Rolldown binding
        run: node scripts/prepare-node22-runtime.mjs
      - name: Generate GraphQL types
        run: npm run codegen
      - name: Check types
        run: npm run typecheck
      - name: Check translations
        run: npm run i18n:check
      - name: Run unit tests
        run: npm test
      - name: Check MiniOxygen security regressions
        run: node --test tests/mini-oxygen-security.unit.test.mjs
      - name: Build storefront
        run: npm run build
      - name: Check dev startup and dependency optimization
        id: dev
        env:
          NATURELLE_RUNTIME_LOG: ${{ runner.temp }}/naturelle-dev-runtime.log
        run: node scripts/check-dev-runtime.mjs
      - name: Preserve dev failure diagnostics
        if: ${{ failure() && steps.dev.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: node22-dev-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/naturelle-dev-runtime.log
          if-no-files-found: ignore
          retention-days: 7
